<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Duval Gravure & Découpe Laser | Lozère & Aveyron</title>
<meta name="description" content="Gravure et découpe laser, impression 3D et créations personnalisées en Lozère et Aveyron.">
<style>
*{box-sizing:border-box} html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}
.hero{
  min-height:100vh;
  position:relative;
  background-image:linear-gradient(90deg,rgba(0,0,0,.60) 0%,rgba(0,0,0,.24) 39%,rgba(0,0,0,0) 67%),url("fond-avec-objet.jpg");
  background-size:cover;
  background-position:center;
  color:white;
  overflow:hidden;
}
.top{position:absolute;left:4%;right:4%;top:24px;display:flex;justify-content:space-between;align-items:flex-start;z-index:2}
.logo{
  background:rgba(255,255,255,.94);color:#111;padding:12px 18px;border-radius:4px;
  box-shadow:0 4px 18px rgba(0,0,0,.18);line-height:1.05;min-width:220px
}
.logo .duval{font-family:Georgia,serif;font-size:30px;letter-spacing:2px}
.logo .sub{font-family:Georgia,serif;font-size:15px;margin-top:4px}
nav{display:flex;gap:30px;padding-top:14px}
nav a{color:#fff;text-decoration:none;font-weight:700;text-shadow:0 1px 4px #000}
.content{position:absolute;left:6%;top:50%;transform:translateY(-43%);width:min(500px,42vw);z-index:2}
.eyebrow{color:#e7c263;font-weight:800;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}
h1{font-family:Georgia,serif;font-size:clamp(43px,5vw,76px);line-height:.95;margin:0 0 20px;text-shadow:0 2px 8px rgba(0,0,0,.5)}
h1 span{color:#e7c263}
p{font-size:17px;line-height:1.45;max-width:490px;text-shadow:0 1px 5px #000}
.buttons{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}
.btn{display:inline-block;padding:14px 22px;border-radius:5px;text-decoration:none;font-weight:800}
.primary{background:#e7b83f;color:#171717}
.secondary{border:2px solid rgba(255,255,255,.85);color:white;background:rgba(0,0,0,.18)}
@media(max-width:800px){
 .hero{background-position:62% center}
 .top{top:12px;left:3%;right:3%}.logo{min-width:170px;padding:9px 12px}.logo .duval{font-size:23px}.logo .sub{font-size:12px}
 nav{display:none}.content{left:6%;top:46%;width:72vw}h1{font-size:44px}p{font-size:14px}
}
</style>
</head>
<body>
<section class="hero" id="accueil">
  <header class="top">
    <div class="logo" aria-label="Duval Gravure et Découpe Laser">
      <div class="duval">DUVAL</div>
      <div class="sub">gravure &amp; découpe laser</div>
    </div>
    <nav>
      <a href="#accueil">Accueil</a>
      <a href="#savoir-faire">Savoir-faire</a>
      <a href="#creations">Nos créations</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <div class="content">
    <div class="eyebrow">Lozère &amp; Aveyron</div>
    <h1>Gravure laser,<br>découpe laser &amp;<br><span>impression 3D</span></h1>
    <p>Créations artisanales et personnalisées, réalisées avec soin pour particuliers, professionnels, boutiques et événements.</p>
    <div class="buttons">
      <a class="btn primary" href="https://wa.me/33788518623?text=Bonjour%20Anthony%2C%20je%20souhaite%20un%20devis.">Demander un devis</a>
      <a class="btn secondary" href="#creations">Voir les créations</a>
    </div>
  </div>
</section>
<div id="savoir-faire"></div><div id="creations"></div><div id="contact"></div>
</body>
</html>
